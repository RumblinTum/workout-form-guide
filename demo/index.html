<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--ink:#0f172a;--muted:#5b6475;--line:#e2e6ee;
  --accent:#2563eb;--accent-ink:#fff;--ok:#16a34a;--warn:#b45309;--far:#a3adbd;--near:#1e293b;--prop:#cbd2dd;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b1120;--card:#141c2f;--ink:#e8edf6;--muted:#9aa5b8;--line:#25304a;
    --accent:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--far:#55627a;--near:#e2e8f0;--prop:#33405a;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
h1{font-size:28px;line-height:1.15;margin:4px 0 6px}
h2{font-size:19px;margin:0 0 8px}
ul{margin:6px 0 0;padding-left:20px}
li{margin:4px 0}

/* Home */
.demo-banner{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#0f172a;color:#e2e8f0;font-size:13px;line-height:1.3;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;text-align:center}
.demo-reset{background:none;border:0;color:#93c5fd;text-decoration:underline;font-size:13px;padding:4px 2px}
.chooser{display:flex;gap:8px;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px}
.chooser button{min-width:84px;height:46px;border:0;border-radius:10px;background:none;font-weight:700;font-size:16px}
.chooser button.on{background:var(--accent);color:#fff}
.home{min-height:calc(100vh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.demo-h{font-size:clamp(24px,6vw,34px);line-height:1.2;margin:0 0 8px;max-width:560px}
.demo-tag{margin:0 0 12px;max-width:560px;color:var(--muted);font-size:16px;line-height:1.35}
.demo-sub{margin:0 0 22px;color:var(--muted);font-size:18px}
.home .brand{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.start{width:min(78vw,340px);height:min(78vw,340px);border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
  font-size:clamp(38px,9vw,56px);font-weight:800;box-shadow:0 18px 40px rgba(37,99,235,.35);transition:transform .12s}
.start:active{transform:scale(.97)}
.today{margin-top:26px;font-size:20px;font-weight:600}
.ramp{margin-top:6px;color:var(--warn);font-weight:600;font-size:15px}
.home .links{margin-top:auto;padding-top:40px;font-size:15px}
.pill{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;margin:0 0 6px}
.pill button{min-width:112px;height:48px;border:0;border-radius:999px;background:none;font-weight:700;font-size:18px;color:var(--ink)}
.pill button.on{background:var(--accent);color:#fff}
.pill.locked button:not(.on){opacity:.4;cursor:default}
.modehint{font-size:14px;color:var(--muted);min-height:20px;margin:0 0 18px}
.start.off{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.pickhint{margin-top:14px;color:var(--muted);font-weight:600;font-size:16px}
.pickhint.nudge{animation:nudge .35s;color:var(--warn)}
@keyframes nudge{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-block;border-radius:10px;padding:4px 10px;font-weight:600;font-size:14px}
.tag.kb{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.5)}
.tag.fail{background:rgba(220,38,38,.09);border:1px solid rgba(220,38,38,.35)}
.wt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.wt label{font-weight:700;font-size:16px}
.wt input{width:104px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:700;text-align:center}
.wt .hint{font-size:14px;color:var(--muted)}
h2.sec{font-size:22px;margin:22px 0 2px}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:8px}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;flex:none}
.top .meta{flex:1;min-width:0}
.top .row{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

/* Exercise screen */
.ex{max-width:980px;margin:0 auto;padding:12px 16px calc(130px + env(safe-area-inset-bottom))}
.ex h1{margin-top:6px}
.rx{font-size:20px;font-weight:700}
.rx .muted{font-weight:500;font-size:16px}
.ss{background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.35);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.anim{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden}
.anim svg{display:block;width:100%;height:auto;max-height:46vh}
.anim .pp{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:15px}
.sets-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sets-head b{font-size:18px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:8px}
.set{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{width:100%;height:84px;border-radius:16px;border:3px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;transition:background .15s,border-color .15s}
.box .ck{font-size:30px;line-height:1;height:32px}
.box.on{background:var(--ok);border-color:var(--ok);color:#fff}
.box.next{border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.25)}
.box.ssgo{overflow:hidden}
.box .ssl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;max-width:100%;padding:0 6px;box-sizing:border-box;font-size:13px;line-height:1.15;text-align:center}
.set input{width:72px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center;font-size:16px}
.cols{display:block}
.daynote{display:inline-block;margin-top:6px;background:rgba(22,163,74,.12);border:1px solid rgba(22,163,74,.35);border-radius:10px;padding:4px 10px;font-weight:600;font-size:15px}
.hold{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.hold .btn{height:52px;font-size:18px}
.hold-t{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.mist li::marker{content:"✕  ";color:#dc2626}
.cues li::marker{content:"✓  ";color:var(--ok)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bottom-in{max-width:980px;margin:0 auto;display:flex;gap:10px}
.btn{height:60px;border-radius:16px;border:0;font-size:20px;font-weight:700;padding:0 18px}
.btn.primary{flex:1;background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line);min-width:96px}
.btn:disabled{opacity:.4}

/* Rest overlay */
.rest{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.82);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;backdrop-filter:blur(3px)}
.rest.show{display:flex}
.rest .lbl{font-size:18px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.rest .tm{font-size:clamp(88px,26vw,170px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin:10px 0}
.rest .nx{font-size:18px;opacity:.9;max-width:520px}
.rest .ring{width:min(70vw,320px);height:10px;border-radius:10px;background:rgba(255,255,255,.2);overflow:hidden;margin:18px 0 26px}
.rest .ring>i{display:block;height:100%;background:#22c55e;width:100%}
.rest .ctl{display:flex;gap:10px;width:100%;max-width:440px;justify-content:center}
.rest .ctl button{flex:1}
.rest .ctl button.skip{flex:1.6}
.rest button{height:68px;min-width:0;padding:0 8px;border-radius:16px;border:0;font-size:20px;font-weight:700;background:rgba(255,255,255,.14);color:#fff}
.rest button.skip{background:#2563eb;min-width:136px}
.goflash{position:fixed;inset:0;z-index:40;background:#facc15;display:flex;align-items:center;justify-content:center;pointer-events:none}
.goflash b{font-size:clamp(80px,24vw,180px);font-weight:900;color:#111;letter-spacing:.04em}

/* Done */
.done{text-align:center;padding-top:12vh}
.done .big{font-size:72px}

/* About */
.day h2{display:flex;justify-content:space-between}
.plan-list{list-style:none;padding:0;margin:0}
.plan-list li>span{white-space:nowrap;flex:none}
.plan-list li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.plan-list li:first-child{border-top:0}
.plan-list a{font-weight:600;text-decoration:none}

@media (min-width:768px){
  .ex .cols{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:start}
  .about-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
  .about-grid .day:last-child{grid-column:1 / -1}
  .wrap.about{max-width:900px}
}
@media (min-width:1024px){ .about-grid{grid-template-columns:repeat(3,1fr)} .about-grid .day:last-child{grid-column:auto} }
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner"><span>Demo · 3-day dumbbell strength plan with form guides</span><button id="resetDemo" class="demo-reset">Reset demo</button></div>
<div id="app"></div>

<div class="rest" id="rest" role="dialog" aria-live="polite" aria-label="Rest timer">
  <div class="lbl">Rest</div>
  <div class="tm" id="restTime">1:15</div>
  <div class="ring"><i id="restBar"></i></div>
  <div class="nx" id="restNext"></div>
  <div style="height:22px"></div>
  <div class="ctl">
    <button id="restMinus" aria-label="15 seconds less">−15 s</button>
    <button class="skip" id="restSkip">Skip</button>
    <button id="restPlus" aria-label="15 seconds more">+15 s</button>
  </div>
</div>

<script>
"use strict";
/* ============ PLAN DATA (edit here) ============ */
/* bw: no weight field; wLabel: custom weight label */
const EX = {
  "goblet-squat": {name:"Goblet Squat", note:"Holding the kettlebell by the horns works best.", cues:["Hold the kettlebell (or one dumbbell) at your chest, elbows tucked.","Feet shoulder-width, toes slightly out.","Take a slow 3 seconds to sit your hips straight down between your feet; chest stays up.","Drive through the whole foot to stand tall."], mistakes:["Dropping fast instead of a 3-second lowering","Heels lifting off the floor","Knees caving inward"]},
  "goblet-squat-pause": {name:"Paused Goblet Squat", note:"Holding the kettlebell by the horns works best.", cues:["Hold the kettlebell (or one dumbbell) at your chest, elbows tucked.","Sit down between your heels, chest up.","Hold the bottom for a full 2 seconds, staying tight.","Drive up through the whole foot."], mistakes:["Relaxing or bouncing out of the pause","Heels lifting off the floor","Knees caving inward"]},
  "db-bench": {name:"Dumbbell Bench Press", note:"No bench? Do it lying on the floor (floor press).", cues:["Lie back, feet flat, shoulder blades squeezed together.","Start with dumbbells over your chest, arms straight.","Lower until your upper arms are about level with your body and you feel a mild chest stretch. Stop if the front of your shoulder pinches.","Press up and slightly together."], mistakes:["Elbows flared straight out at 90°","Bouncing the weights off your chest","Lifting hips off the bench"]},
  "db-floor-press": {name:"Dumbbell Floor Press", cues:["Lie on the floor, knees bent, feet flat.","Start with dumbbells over your chest, arms straight.","Lower until your upper arms rest on the floor.","Pause for a beat, then press back up."], mistakes:["Slamming the elbows into the floor","Elbows flared straight out","Wrists bent back"]},
  "one-arm-row": {name:"One-Arm Dumbbell Row", cues:["Brace one hand on a bench or sturdy surface; back flat.","Let the dumbbell hang straight down.","Pull your elbow back toward your hip.","Lower under control to a full stretch."], mistakes:["Twisting the torso to heave the weight","Shrugging toward the ear","Rounded back"]},
  "rdl": {name:"Dumbbell Romanian Deadlift", cues:["Stand tall, dumbbells in front of thighs, soft knees.","Hip hinge: push hips straight back; dumbbells slide down close to your legs.","Stop when your back is about to round, usually just below the knee. Depth comes as your hamstrings loosen up.","Squeeze glutes to stand back up."], mistakes:["Rounding the back","Turning it into a squat (knees bending a lot)","Letting the weights drift away from your legs"]},
  "lateral-raise": {name:"Lateral Raise", cues:["Stand tall, dumbbells at your sides, slight bend in elbows.","Raise arms out to the sides to shoulder height.","Lead with the elbows; hands no higher than elbows.","Lower slowly over 2–3 seconds."], mistakes:["Swinging or shrugging","Lifting above shoulder height","Going too heavy"]},
  "plank": {name:"Plank", bw:1, cues:["Forearms on the floor, elbows under shoulders.","Straight line from head to heels; squeeze glutes and brace abs.","Tuck ribs down slightly and look at the floor.","Breathe steadily through the hold."], mistakes:["Hips sagging","Hips piked up high","Holding your breath"]},
  "split-squat": {name:"Split Squat", cues:["Long staggered stance, dumbbells at your sides, torso tall.","Lower straight down until the back knee nearly touches the floor.","Front shin stays about vertical; weight across your whole front foot.","Drive through the whole front foot to rise."], mistakes:["Stance too short (front heel lifts)","Front knee caving in","Leaning far forward"]},
  "seated-oh-press": {name:"Seated Dumbbell Overhead Press", cues:["Sit on a bench (back pad upright if you have one), feet planted.","Rest the dumbbells on your thighs and kick them up to your shoulders one knee at a time, then reverse that to set them down.","Dumbbells at shoulder height, wrists stacked over elbows.","Brace and press straight up until arms lock out overhead.","Lower under control back to shoulder height."], mistakes:["Arching the lower back off the pad","Pressing forward instead of straight up","Half reps"]},
  "chest-supported-row": {name:"Chest-Supported Incline Row", note:"Lie face down on a bench set to an incline (about 30–45°).", cues:["Chest on the pad, feet on the floor, arms hanging straight down.","Row both elbows back toward your hips.","Squeeze shoulder blades together for a beat at the top.","Lower slowly to a full stretch."], mistakes:["Lifting your chest off the pad to heave","Shrugging toward the ears","Cutting the stretch short"]},
  "sl-rdl": {name:"Single-Leg Romanian Deadlift", note:"Hold the kettlebell in the hand opposite your standing leg.", cues:["Hold a rack or wall for balance.","Kettlebell in the hand opposite your standing leg.","Soft knee on the standing leg; hinge at the hip.","Back leg rises as your chest lowers: one straight line from head to heel.","Keep hips square to the floor; squeeze the glute to stand."], mistakes:["Rounding the back","Hip rotating open toward the ceiling","Locking the standing knee"]},
  "db-curl": {name:"Dumbbell Curl", cues:["Stand tall, palms forward, elbows pinned at your sides.","Curl up until forearms are vertical.","Squeeze, then lower slowly (2–3 seconds).","Fully straighten at the bottom."], mistakes:["Swinging with the hips or back","Elbows drifting forward","Half reps"]},
  "oh-triceps": {name:"Overhead Triceps Extension", cues:["Hold one dumbbell overhead with both hands.","Cup the top of the dumbbell with both palms, thumbs wrapped.","Keep elbows pointing up and close to your head.","Lower the weight behind your head by bending only the elbows.","Straighten arms fully to the top.","Go lighter than you'd guess, since control matters more than weight here."], mistakes:["Elbows flaring wide","Arching the lower back (brace your abs)","Moving the upper arms"]},
  "farmer-carry": {name:"Farmer Carry", cues:["Pick up heavy weights with a flat back.","Stand tall, shoulders back and down, arms straight.","Walk with short, controlled steps; brace your abs.","Set them down with a flat back."], mistakes:["Leaning to one side or shrugging","Letting the weights swing","Rounding the back to pick up or set down"]},
  "push-up": {name:"Push-Up", bw:1, note:"Hands up on a bench if needed to get good-form reps. To progress, put your feet on the bench.", cues:["Hands slightly wider than shoulders; body in one straight line.","Lower your chest toward the floor, elbows about 45° from your body.","Push the floor away until arms are straight.","End each set about 2 reps before failure."], mistakes:["Hips sagging or piking up","Elbows flared straight out","Half reps or head dropping"]},
  "kb-swing": {name:"Kettlebell Swing", note:"A hip hinge, not a squat and not an arm lift.", cues:["Feet a bit wider than shoulders, bell about a foot in front of you.","Hike the bell back between your legs by pushing your hips back, flat back, soft knees.","Snap your hips forward and squeeze your glutes; the bell floats up to about chest height.","Let it fall back into the next hinge; arms stay long and relaxed."], mistakes:["Squatting down instead of hinging","Lifting the bell with your arms","Leaning back at the top"]},
  "step-up": {name:"Step-Up", cues:["Use a sturdy box or bench, knee height or lower.","Put your whole foot on the box.","Drive through that heel to stand tall on top.","Step down slowly; finish one leg, then switch."], mistakes:["Pushing off the back foot","Front knee caving in","Dropping down fast"]},
  "rear-delt-fly": {name:"Rear-Delt Fly", note:"Easier on your back: lie chest-down on the bench at 30° and do the fly from there.", cues:["Hinge forward until your torso is nearly parallel to the floor, back flat.","Light dumbbells hang under your shoulders, palms in, elbows slightly bent.","Raise arms out to the sides to shoulder height, leading with the back of the shoulders.","Lower slowly."], mistakes:["Going heavy and swinging","Shrugging the shoulders","Standing up as you lift"]},
  "dead-bug": {name:"Dead Bug", bw:1, cues:["Lie on your back, arms straight up, hips and knees bent 90° (tabletop).","Press your lower back gently into the floor.","Slowly reach one arm overhead while straightening the opposite leg, hovering just off the floor.","Return and switch sides; breathe out as you reach."], mistakes:["Lower back arching off the floor","Rushing the reps","Moving the same-side arm and leg"]},
  /* ---- gym ---- */
  "bb-squat": {name:"Barbell Back Squat", note:"Squat in a rack with the safety arms set just below your bottom position.", cues:["Bar across your upper back (on the muscle, not your neck), hands just outside shoulders, elbows down.","Feet shoulder-width, toes slightly out; take a big breath and brace before each rep.","Sit hips down and back, knees tracking over your toes, until thighs are about parallel.","Drive up through the whole foot, keeping the bar over the middle of your foot."], mistakes:["Heels lifting or weight shifting to the toes","Knees caving inward","Hips shooting up first so the chest drops"]},
  "bb-bench": {name:"Barbell Bench Press", note:"Use the rack's safety arms (set just below chest height) or a spotter.", cues:["Eyes under the bar, feet flat, shoulder blades squeezed and pinned.","Grip a bit wider than shoulders, wrists stacked over elbows.","Lower the bar under control to your lower chest, elbows about 45° from your body.","Press up and slightly back over your shoulders."], mistakes:["Bouncing the bar off your chest","Elbows flared straight out to 90°","Hips lifting off the bench"]},
  "cable-row": {name:"Seated Cable Row", cues:["Sit tall, feet on the platform, knees slightly bent.","Start with arms long and shoulders reaching forward a little.","Pull the handle to your belly, driving your elbows back, chest up.","Pause, then let your arms straighten slowly."], mistakes:["Rocking your torso back and forth to move the weight","Shrugging toward the ears","Rounding the lower back"]},
  "bb-rdl": {name:"Barbell Romanian Deadlift", cues:["Stand tall, bar at your hips, hands just outside your thighs, soft knees.","Push hips straight back; slide the bar down your thighs, close to your legs.","Stop when your back is about to round, usually just below the knee. Depth comes as your hamstrings loosen up.","Squeeze your glutes to stand tall; don't lean back at the top."], mistakes:["Rounding the back","Bar drifting away from your legs","Bending the knees into a squat"]},
  "cable-lateral-raise": {name:"Cable Lateral Raise", cues:["Stand side-on to a low pulley, handle in the far hand, cable crossing in front of you.","Slight bend in the elbow; hold the machine with your other hand.","Raise your arm out to the side to shoulder height, leading with the elbow.","Lower slowly against the cable's pull."], mistakes:["Leaning away to swing the weight","Shrugging the shoulder","Raising above shoulder height"]},
  "cable-crunch": {name:"Cable Crunch", cues:["Kneel facing a high pulley, rope held beside your head.","Keep your hips still, stacked over your knees.","Curl your ribs toward your hips, rounding your spine, elbows toward your thighs.","Pause, then uncurl slowly."], mistakes:["Sitting your hips back to pull with bodyweight","Pulling with your arms","Rushing the return"]},

const okKey=k=>typeof k==="string"&&k.indexOf(DEMO_PREFIX)===0;   // the demo never touches the real app's keys
const store = {
  get(k){ if(!okKey(k)) return null; try{ const v = localStorage.getItem(k); return v==null?null:JSON.parse(v); }catch(e){ return null; } },
  set(k,v){ if(!okKey(k)) return; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ if(!okKey(k)) return; try{ localStorage.removeItem(k); }catch(e){} }
};
const pad = n => String(n).padStart(2,"0");
function today(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dayDiff(a,b){ const p=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d);}; return Math.round((p(b)-p(a))/864e5); }
/* rotation A→B→C is shared by Home and Gym */
function nextDay(){ const pk=store.get("wfg-demo-pick"); if(pk&&PLANS.home[pk]) return pk; const last=store.get("wfg-demo-last"); return last ? ({A:"B",B:"C",C:"A"})[last.day]||"A" : "A"; }
const dayLabel=d=>({A:"1",B:"2",C:"3"})[d]||d;   /* display only; keys stay A/B/C */
function rampActive(){ return false; } /* demo: always full sets */
const itemsOf = s => PLANS[s.mode][s.day];
const lastMode = () => { const m=store.get("wfg-demo-mode"); return MODES[m]?m:null; };
/* per-exercise rest (default from the plan; −15/+15 remembered per mode + exercise) */
function restFor(mode,it){ const m=store.get("wfg-demo-restx")||{}, v=m[mode+":"+it.id]; return (typeof v==="number"&&v>=15&&v<=600)?v:it.rest; }
function setRestFor(mode,id,v){ const m=store.get("wfg-demo-restx")||{}; m[mode+":"+id]=v; store.set("wfg-demo-restx",m); }
/* weight memory: last entered weight per exercise, separately for Home and Gym */
function weights(mode){ const w=store.get("wfg-demo-w:"+mode); return w&&typeof w==="object"?w:{}; }
function setWeight(mode,id,v){ const w=weights(mode); if(v) w[id]=v; else delete w[id]; store.set("wfg-demo-w:"+mode,w); }
/* sessions saved before Home/Gym existed: map them onto the new Home plan by exercise */
function migrate(s){
  if(!s||s.mode) return s;
  const items=PLANS.home[s.day]; if(!items||!Array.isArray(s.sets)) return null;
  const old=LEGACY_IDS[s.day]||[], curId=old[s.idx];
  s.sets=items.map(it=>{ const oi=old.indexOf(it.id), prev=(oi>=0&&s.sets[oi])||[], n=s.ramp?Math.min(RAMP_SETS,it.sets):it.sets;
    return Array.from({length:n},(_,j)=>prev[j]?{d:!!prev[j].d,r:prev[j].r||""}:{d:false,r:""}); });
  const ni=items.findIndex(it=>it.id===curId); s.idx=ni>=0?ni:0;
  s.mode="home"; delete s.rest; s.migrated=1; save(s); return s;
}
if(store.get("wfg-demo-rest")!=null) store.del("wfg-demo-rest");   // old single rest setting (now per exercise)
function current(){ const k=store.get("wfg-demo-current"); if(!k) return null; const s=store.get(k); return s && !s.completed && s.day ? migrate(s) : null; }
function save(s){ store.set(s.key, s); }
function startSession(mode){
  let s=current(); if(s) return s;
  if(!PLANS[mode]) return null;
  if(!store.get("wfg-demo-firstStart")) store.set("wfg-demo-firstStart", today());
  const day=nextDay(), date=today(), ramp=rampActive();
  s={key:"wfg-demo-session:"+mode+":"+day+":"+date, mode, day, date, ramp, idx:0, startedAt:Date.now(),
     sets:PLANS[mode][day].map(it=>Array.from({length: ramp?Math.min(RAMP_SETS,it.sets):it.sets},()=>({d:false,r:""})))};
  save(s); store.set("wfg-demo-current", s.key); store.set("wfg-demo-mode", mode); return s;
}
/* Counted sets: a superset round (a + b) counts as ONE set. */
function counts(s){ let d=0,t=0; const items=itemsOf(s);
  s.sets.forEach((a,i)=>{ const it=items[i]; if(it.ss===2) return;
    a.forEach((x,j)=>{ t++; const done = it.ss===1 ? (x.d && s.sets[i+1][j] && s.sets[i+1][j].d) : x.d; if(done) d++; }); });
  return {d,t}; }
function planSets(mode,d,ramp){ return PLANS[mode][d].reduce((a,x)=>a+(x.ss===2?0:(ramp?Math.min(RAMP_SETS,x.sets):x.sets)),0); }
function rxText(it,n){ return it.repsText ? n+' sets · '+it.repsText : n+' × '+it.reps; }
function fmtRest(sec){ return sec<120 ? sec+" s" : (sec%60 ? Math.floor(sec/60)+":"+pad(sec%60) : sec/60)+" min"; }
function finish(s){
  cancelRest(false);
  const c=counts(s); s.completed=true; s.completedAt=Date.now(); save(s);
  store.set("wfg-demo-last",{day:s.day,mode:s.mode,date:s.date,done:c.d,total:c.t});
  const h=store.get("wfg-demo-history")||[]; h.push({day:s.day,mode:s.mode,date:s.date,done:c.d,total:c.t}); store.set("wfg-demo-history",h.slice(-200));
  store.del("wfg-demo-current"); store.del("wfg-demo-pick"); pickMode=null;
  go("#/done");
}

/* ============ AUDIO (unlocked on first tap) ============ */
let actx=null;
function unlockAudio(){
  try{
    if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); }
    if(actx && actx.state==="suspended") actx.resume();
    if(actx && !actx._primed){ const o=actx.createOscillator(),g=actx.createGain(); g.gain.value=0.0001; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+0.02); actx._primed=true; }
  }catch(e){}
}
function beep(){
  try{
    if(actx){ if(actx.state==="suspended") actx.resume();
      [0,0.22].forEach(off=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type="sine"; o.frequency.value=880;
        const t0=actx.currentTime+off; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.35,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);
        o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+0.2); });
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([180,80,180]); }catch(e){}
  window.__beeps=(window.__beeps||0)+1;
}
document.addEventListener("pointerdown", unlockAudio, {passive:true});
document.addEventListener("touchend", unlockAudio, {passive:true});

/* ============ FLOW LOGIC ============ */
function nextUnchecked(s,i){ return s.sets[i].findIndex(x=>!x.d); }
/* Where to go after set j of exercise i is checked. Returns {type:'set'|'ex'|'done', i, rest:boolean} */
function planAfterCheck(s,i){
  const items=itemsOf(s), it=items[i];
  if(it.ss===1){ // first half of superset: straight to partner, no rest
    if(nextUnchecked(s,i+1)>=0) return {type:"ex",i:i+1,rest:false};
    if(nextUnchecked(s,i)>=0) return {type:"set",i,rest:true};
  }
  if(it.ss===2){ // second half: rest, then back to partner if it still has sets
    if(nextUnchecked(s,i-1)>=0) return {type:"ex",i:i-1,rest:true};
  }
  if(nextUnchecked(s,i)>=0) return {type:"set",i,rest:true};
  if(i+1<items.length) return {type:"ex",i:i+1,rest:true};
  return {type:"done",rest:false};
}
function applyTarget(s,tg){
  if(tg.type==="done"){ finish(s); return; }
  if(s.idx!==tg.i){ s.idx=tg.i; save(s); }
  if(location.hash!=="#/go") go("#/go"); else render();
  window.scrollTo(0,0);
}

/* ============ REST TIMER (timestamp based, per-exercise default) ============ */
let restTick=null, wakeLock=null, wakeOn=0;
const $=id=>document.getElementById(id);
function keepAwake(on){
  try{
    if(!on){ wakeOn=0; const w=wakeLock; wakeLock=null; if(w&&w.release){ try{ const r=w.release(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} } return; }
    const n=++wakeOn;
    if(!navigator.wakeLock||!navigator.wakeLock.request) return;
    navigator.wakeLock.request("screen").then(l=>{ if(n===wakeOn) wakeLock=l; else try{ l.release(); }catch(e){} }).catch(()=>{});
  }catch(e){}
}
function flashGo(){
  try{
    const el=document.createElement("div"); el.className="goflash"; el.innerHTML="<b>Go</b>";
    document.body.appendChild(el);
    setTimeout(()=>{ try{ el.remove(); }catch(e){} },2000);
  }catch(e){}
}
function ssFlash(name){
  const prev=document.getElementById("ssFlash"); if(prev) prev.remove();
  const el=document.createElement("div");
  el.id="ssFlash"; el.setAttribute("role","status");
  el.style.cssText="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;background:#ffd60a;color:#000;font-weight:700;padding:10px 14px;border-radius:10px;max-width:92vw;text-align:center";
  el.textContent="Superset → "+name+" now, rest comes after";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1800);
}
function fmt(sec){ sec=Math.max(0,Math.ceil(sec)); return Math.floor(sec/60)+":"+pad(sec%60); }
function startRest(s,tg,label,it){
  const dur=restFor(s.mode,it);
  s.rest={end:Date.now()+dur*1000,total:dur,tg,label,ex:it.id,base:dur}; save(s);
  showRest();
}
function showRest(){
  const s=current(); if(!s||!s.rest){ hideRest(); return; }
  $("rest").classList.add("show"); $("restNext").textContent=s.rest.label||"";
  keepAwake(true);
  clearInterval(restTick); restTick=setInterval(updateRest,200); updateRest();
}
function hideRest(){ $("rest").classList.remove("show"); clearInterval(restTick); restTick=null; keepAwake(false); }
function updateRest(){
  const s=current(); if(!s||!s.rest){ hideRest(); return; }
  const left=(s.rest.end-Date.now())/1000;
  $("restTime").textContent=fmt(left);
  $("restBar").style.width=Math.max(0,Math.min(100,left/s.rest.total*100))+"%";
  if(left<=0) endRest(true);
}
function endRest(withBeep){
  const s=current(); if(!s||!s.rest){ hideRest(); return; }
  const tg=s.rest.tg; delete s.rest; save(s); hideRest();
  if(withBeep){
    beep();
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
    flashGo();
  }
  applyTarget(s,tg);
}
function cancelRest(rerender){ const s=current(); if(s&&s.rest){ delete s.rest; save(s);} hideRest(); if(rerender) render(); }
function adjustRest(delta){
  const s=current(); if(!s||!s.rest) return;
  const nd=Math.max(15,Math.min(600,(s.rest.base||s.rest.total)+delta));
  if(s.rest.ex) setRestFor(s.mode,s.rest.ex,nd);
  s.rest.base=nd; s.rest.end+=delta*1000; s.rest.total=Math.max(15,s.rest.total+delta); save(s); updateRest();
}
$("restSkip").onclick=()=>endRest(false);
$("restMinus").onclick=()=>adjustRest(-15);
$("restPlus").onclick=()=>adjustRest(15);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ if(current()&&current().rest) keepAwake(true); updateRest(); } });
window.addEventListener("focus",updateRest);
window.addEventListener("pageshow",updateRest);

/* ============ FIGURE RENDERER ============ */
/* 2-bone IK: joint between A and target T. pick: 'fwd' (larger x), 'back' (smaller x), 'down' (larger y), 'up' (smaller y) */
function ik(A,T,l1,l2,pick){
  const dx=T[0]-A[0], dy=T[1]-A[1], d0=Math.hypot(dx,dy)||0.001, d=Math.max(Math.abs(l1-l2)+0.01,Math.min(d0,l1+l2-0.01));
  const ang=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d)))), base=Math.atan2(dy,dx);
  const c1=[A[0]+l1*Math.cos(base+ang),A[1]+l1*Math.sin(base+ang)], c2=[A[0]+l1*Math.cos(base-ang),A[1]+l1*Math.sin(base-ang)];
  if(pick==="fwd") return c1[0]>c2[0]?c1:c2; if(pick==="back") return c1[0]<c2[0]?c1:c2; if(pick==="up") return c1[1]<c2[1]?c1:c2; return c1[1]>c2[1]?c1:c2;
}
/* arm reaching for a target: returns [elbow, hand]; a target out of reach gives a straight arm pointing at it */
function armTo(A,T,pick,as){
  const l1=L.ua*as, l2=L.fa*as, d0=Math.hypot(T[0]-A[0],T[1]-A[1])||0.001, max=l1+l2-0.01;
  const H = d0>max ? add(A,mul([T[0]-A[0],T[1]-A[1]],max/d0)) : T;
  return [ik(A,H,l1,l2,pick),H];
}
function fk(p,anim){
  const f=(k,d)=>p[k]!=null?p[k]:p[d];
  const as=p.as!=null?p.as:1;
  let hip,knee,ank,knee2,ank2,sh,head,t=p.t||0;
  if(anim.line){ // straight body from the ankles (plank, push-up)
    const e=p.e*R, u=[Math.cos(e),-Math.sin(e)];
    ank=anim.line.ankle.slice(); knee=add(ank,mul(u,L.sh)); hip=add(knee,mul(u,L.th));
    sh=add(hip,mul(u,L.t)); head=add(hip,mul(u,L.t+L.hr+4)); knee2=knee; ank2=ank;
  } else {
    if(p.ankT){ hip=p.hip.slice(); ank=p.ankT.slice(); knee=ik(hip,ank,L.th,L.sh,anim.kp||"fwd"); }
    else if(anim.fixN){ hip=p.hip.slice(); ank=anim.fixN.slice(); knee=ik(hip,ank,L.th,L.sh,"fwd"); }
    else {
      const kn=dir(p.th,L.th), an=add(kn,dir(p.sh,L.sh));
      if(p.hip) hip=p.hip.slice(); else { const ax=anim.ax||104; hip=[ax-an[0],ANK-an[1]]; }
      knee=add(hip,kn); ank=add(knee,dir(p.sh,L.sh));
    }
    if(anim.fix2){ ank2=anim.fix2.slice(); knee2=ik(hip,ank2,L.th,L.sh,"down"); }
    else if(p.th2!=null||!(anim.fixN||p.ankT)){ knee2=add(hip,dir(f("th2","th"),L.th)); ank2=add(knee2,dir(f("sh2","sh"),L.sh)); }
    else { knee2=knee; ank2=ank; }
    if(p.shT) t=Math.atan2(p.shT[0]-hip[0],p.shT[1]-hip[1])/R;
    sh=add(hip,dir(t,L.t));
    const c=add(add(hip,mul(dir(t,L.t),.5)),dir(t+90,(p.curl||0)*2)), v=[sh[0]-c[0],sh[1]-c[1]], vl=Math.hypot(v[0],v[1])||1;
    head=add(sh,mul(v,(L.hr+4)/vl));
  }
  const toe=add(ank,dir(p.fd!=null?p.fd:90,L.ft)), toe2=add(ank2,dir(p.fd2!=null?p.fd2:(p.fd!=null?p.fd:90),L.ft));

  const tgt = p.hand ? p.hand : p.hrel ? add(add(sh,dir(t,p.hrel[0])),dir(t+90,p.hrel[1])) : p.hhip ? add(hip,p.hhip) : null;
  if(anim.line&&anim.line.hand){ hd=anim.line.hand.slice(); el=ik(sh,hd,L.ua,L.fa,"back"); el2=el; hd2=hd; }
  else if(tgt){ [el,hd]=armTo(sh,tgt,anim.ep||"down",as); el2=el; hd2=hd; }
  else { el=add(sh,dir(p.ua,L.ua*as)); hd=add(el,dir(p.fa,L.fa*as)); el2=add(sh,dir(f("ua2","ua"),L.ua*as)); hd2=add(el2,dir(f("fa2","fa"),L.fa*as)); }

}
function lerpPose(a,b,u){ const o={}; for(const k in a){ const va=a[k], vb=b[k]; if(Array.isArray(va)&&Array.isArray(vb)) o[k]=va.map((x,i)=>x+(vb[i]-x)*u); else if(typeof va==="number" && typeof vb==="number") o[k]=va+(vb-va)*u; else o[k]=va; } return o; }
function el(tag,attrs,parent){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function line(parent,cls){ return el("line",{class:cls,"stroke-linecap":"round"},parent); }
function setLine(l,a,b){ l.setAttribute("x1",a[0].toFixed(1)); l.setAttribute("y1",a[1].toFixed(1)); l.setAttribute("x2",b[0].toFixed(1)); l.setAttribute("y2",b[1].toFixed(1)); }

/* kettlebell: handle ring at the hand, bell hanging below (goblet) or flung along the forearm (swing) */
function mkKB(svg,cls){ return {h:el("circle",{r:4.2,fill:"none",class:cls+"k","stroke-width":2.6},svg), b:el("circle",{r:7.5,class:cls},svg)}; }

    setC(P.hands[0],hL); setC(P.hands[1],hR); setLine(P.levers[0],[110,58],hL); setLine(P.levers[1],[110,58],hR);

const BACKUP_PREFIX="wfg-demo-";

function importBackup(text){
  let obj=null;
  try{ obj=JSON.parse(text); }catch(e){ alert("That file isn't a valid backup."); return; }
  if(!obj||obj.app!=="workout-form-guide"||obj.version!==BACKUP_PREFIX||!obj.data||typeof obj.data!=="object"||Array.isArray(obj.data)){
    alert("That backup doesn't match this app."); return;
  }
  const keys=Object.keys(obj.data);
  if(!keys.every(k=>isAppKey(k)&&typeof obj.data[k]==="string")){ alert("That backup doesn't match this app."); return; }
  if(!confirm("Replace all saved data on this device with this backup?")) return;
  try{
    const old=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(isAppKey(k)) old.push(k); }
    keys.forEach(k=>localStorage.setItem(k,obj.data[k]));
    old.forEach(k=>{ if(!(k in obj.data)) localStorage.removeItem(k); });
  }catch(e){ alert("Couldn't import that backup."); return; }
  render();
}

    FOOT+'</div>';
  $("exportBtn").onclick=()=>exportBackup();
  $("importFile").onchange=e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return; f.text().then(importBackup).catch(()=>alert("Couldn't read that file.")); };
}

function viewExercise(ref){
  let id=ref, it=null, mode="home"; const m=ref.match(/^(home|gym)\/([ABC])\/(\d+)$/);
  if(m&&PLANS[m[1]][m[2]][+m[3]]){ mode=m[1]; it=PLANS[mode][m[2]][+m[3]]; id=it.id; }
  else { outer: for(const md in PLANS) for(const d in PLANS[md]){ const f=PLANS[md][d].find(x=>x.id===id); if(f){ it=f; mode=md; break outer; } } }
  if(!EX[id]){ go("#/about"); return; }
  app.innerHTML='<div class="ex"><p><a href="#/about">← About the plan</a></p>'+exBody(id,it?{...it,ss:0,tag:""}:null,null,0,mode)+FOOT+'</div>';
  mountFigure($("anim"),id);
}

function render(){
  const h=location.hash||"#/";
  if(h!=="#/go") hideRest();
  stopHold();
  if(h==="#/go") viewWorkout();
  else if(h==="#/done") viewDone();
  else if(h==="#/about") viewAbout();
  else if(h.startsWith("#/ex/")) viewExercise(decodeURIComponent(h.slice(5)));
  else { animState=null; viewHome(); }
  if(!h.startsWith("#/go")&&!h.startsWith("#/ex")) animState=animState&&animState.svg.isConnected?animState:null;
}
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });
$("resetDemo").onclick=()=>{ hideRest(); stopHold();
  try{ const ks=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(okKey(k)) ks.push(k); } ks.forEach(k=>localStorage.removeItem(k)); }catch(e){}
  if(location.hash&&location.hash!=="#/") location.hash="#/"; else render(); window.scrollTo(0,0); };
render();

</script>
</body>
</html>
