<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--ink:#0f172a;--muted:#5b6475;--line:#e2e6ee;
  --accent:#2563eb;--accent-ink:#fff;--ok:#16a34a;--warn:#b45309;--far:#a3adbd;--near:#1e293b;--prop:#cbd2dd;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b1120;--card:#141c2f;--ink:#e8edf6;--muted:#9aa5b8;--line:#25304a;
    --accent:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--far:#55627a;--near:#e2e8f0;--prop:#33405a;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
h1{font-size:28px;line-height:1.15;margin:4px 0 6px}
h2{font-size:19px;margin:0 0 8px}
ul{margin:6px 0 0;padding-left:20px}
li{margin:4px 0}

/* Home */
.demo-banner{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#0f172a;color:#e2e8f0;font-size:13px;line-height:1.3;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;text-align:center}
.demo-reset{background:none;border:0;color:#93c5fd;text-decoration:underline;font-size:13px;padding:4px 2px}
.chooser{display:flex;gap:8px;margin:0 0 22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px}
.chooser button{min-width:84px;height:46px;border:0;border-radius:10px;background:none;font-weight:700;font-size:16px}
.chooser button.on{background:var(--accent);color:#fff}
.home{min-height:calc(100vh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.demo-h{font-size:clamp(24px,6vw,34px);line-height:1.2;margin:0 0 8px;max-width:560px}
.demo-sub{margin:0 0 22px;color:var(--muted);font-size:18px}
.home .brand{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.start{width:min(78vw,340px);height:min(78vw,340px);border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
  font-size:clamp(38px,9vw,56px);font-weight:800;box-shadow:0 18px 40px rgba(37,99,235,.35);transition:transform .12s}
.start:active{transform:scale(.97)}
.today{margin-top:26px;font-size:20px;font-weight:600}
.ramp{margin-top:6px;color:var(--warn);font-weight:600;font-size:15px}
.home .links{margin-top:auto;padding-top:40px;font-size:15px}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:8px}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;flex:none}
.top .meta{flex:1;min-width:0}
.top .row{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

/* Exercise screen */
.ex{max-width:980px;margin:0 auto;padding:12px 16px calc(130px + env(safe-area-inset-bottom))}
.ex h1{margin-top:6px}
.rx{font-size:20px;font-weight:700}
.rx .muted{font-weight:500;font-size:16px}
.ss{background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.35);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.anim{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden}
.anim svg{display:block;width:100%;height:auto;max-height:46vh}
.anim .pp{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:15px}
.sets-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sets-head b{font-size:18px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:8px}
.set{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{width:100%;height:84px;border-radius:16px;border:3px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;transition:background .15s,border-color .15s}
.box .ck{font-size:30px;line-height:1;height:32px}
.box.on{background:var(--ok);border-color:var(--ok);color:#fff}
.box.next{border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.25)}
.set input{width:72px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center;font-size:16px}
.cols{display:block}
.daynote{display:inline-block;margin-top:6px;background:rgba(22,163,74,.12);border:1px solid rgba(22,163,74,.35);border-radius:10px;padding:4px 10px;font-weight:600;font-size:15px}
.hold{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.hold .btn{height:52px;font-size:18px}
.hold-t{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.mist li::marker{content:"✕  ";color:#dc2626}
.cues li::marker{content:"✓  ";color:var(--ok)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bottom-in{max-width:980px;margin:0 auto;display:flex;gap:10px}
.btn{height:60px;border-radius:16px;border:0;font-size:20px;font-weight:700;padding:0 18px}
.btn.primary{flex:1;background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line);min-width:96px}
.btn:disabled{opacity:.4}

/* Rest overlay */
.rest{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.82);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;backdrop-filter:blur(3px)}
.rest.show{display:flex}
.rest .lbl{font-size:18px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.rest .tm{font-size:clamp(88px,26vw,170px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin:10px 0}
.rest .nx{font-size:18px;opacity:.9;max-width:520px}
.rest .ring{width:min(70vw,320px);height:10px;border-radius:10px;background:rgba(255,255,255,.2);overflow:hidden;margin:18px 0 26px}
.rest .ring>i{display:block;height:100%;background:#22c55e;width:100%}
.rest .ctl{display:flex;gap:10px;width:100%;max-width:440px;justify-content:center}
.rest .ctl button{flex:1}
.rest .ctl button.skip{flex:1.6}
.rest button{height:68px;min-width:0;padding:0 8px;border-radius:16px;border:0;font-size:20px;font-weight:700;background:rgba(255,255,255,.14);color:#fff}
.rest button.skip{background:#2563eb;min-width:136px}

/* Done */
.done{text-align:center;padding-top:12vh}
.done .big{font-size:72px}

/* About */
.day h2{display:flex;justify-content:space-between}
.plan-list{list-style:none;padding:0;margin:0}
.plan-list li>span{white-space:nowrap;flex:none}
.plan-list li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.plan-list li:first-child{border-top:0}
.plan-list a{font-weight:600;text-decoration:none}

@media (min-width:768px){
  .ex .cols{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:start}
  .about-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
  .about-grid .day:last-child{grid-column:1 / -1}
  .wrap.about{max-width:900px}
}
@media (min-width:1024px){ .about-grid{grid-template-columns:repeat(3,1fr)} .about-grid .day:last-child{grid-column:auto} }
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner"><span>Demo · 3-day dumbbell strength plan with form guides</span><button id="resetDemo" class="demo-reset">Reset demo</button></div>
<div id="app"></div>

<div class="rest" id="rest" role="dialog" aria-live="polite" aria-label="Rest timer">
  <div class="lbl">Rest</div>
  <div class="tm" id="restTime">1:15</div>
  <div class="ring"><i id="restBar"></i></div>
  <div class="nx" id="restNext"></div>
  <div style="height:22px"></div>
  <div class="ctl">
    <button id="restMinus" aria-label="15 seconds less">−15 s</button>
    <button class="skip" id="restSkip">Skip</button>
    <button id="restPlus" aria-label="15 seconds more">+15 s</button>
  </div>
</div>

<script>
"use strict";
/* ============ PLAN DATA (edit here) ============ */
const EX = {
  "goblet-squat": {name:"Goblet Squat", cues:["Hold one dumbbell vertically at your chest, elbows tucked.","Feet shoulder-width, toes slightly out.","Take a slow 3 seconds to sit hips down and back between your heels; chest stays up.","Drive through the whole foot to stand tall."], mistakes:["Dropping fast instead of a 3-second lowering","Heels lifting off the floor","Knees caving inward"]},
  "goblet-squat-pause": {name:"Paused Goblet Squat", cues:["Hold one dumbbell vertically at your chest, elbows tucked.","Sit down between your heels, chest up.","Hold the bottom for a full 2 seconds, staying tight.","Drive up through the whole foot."], mistakes:["Relaxing or bouncing out of the pause","Heels lifting off the floor","Knees caving inward"]},
  "db-bench": {name:"Dumbbell Bench Press", note:"No bench? Do it lying on the floor (floor press).", cues:["Lie back, feet flat, shoulder blades squeezed together.","Start with dumbbells over your chest, arms straight.","Lower slowly until elbows are just below the bench, about 45° from your body.","Press up and slightly together."], mistakes:["Elbows flared straight out at 90°","Bouncing the weights off your chest","Lifting hips off the bench"]},
  "one-arm-row": {name:"One-Arm Dumbbell Row", cues:["Brace one hand on a bench or sturdy surface; back flat.","Let the dumbbell hang straight down.","Pull your elbow back toward your hip.","Lower under control to a full stretch."], mistakes:["Twisting the torso to heave the weight","Shrugging toward the ear","Rounded back"]},
  "rdl": {name:"Dumbbell Romanian Deadlift", cues:["Stand tall, dumbbells in front of thighs, soft knees.","Hip hinge: push hips straight back; dumbbells slide down close to your legs.","Keep a flat back; stop at a strong hamstring stretch (about mid-shin).","Squeeze glutes to stand back up."], mistakes:["Rounding the back","Turning it into a squat (knees bending a lot)","Letting the weights drift away from your legs"]},
  "lateral-raise": {name:"Lateral Raise", cues:["Stand tall, dumbbells at your sides, slight bend in elbows.","Raise arms out to the sides to shoulder height.","Lead with the elbows; hands no higher than elbows.","Lower slowly over 2–3 seconds."], mistakes:["Swinging or shrugging","Lifting above shoulder height","Going too heavy"]},
  "plank": {name:"Plank", cues:["Forearms on the floor, elbows under shoulders.","Straight line from head to heels; squeeze glutes and brace abs.","Tuck ribs down slightly and look at the floor.","Breathe steadily through the hold."], mistakes:["Hips sagging","Hips piked up high","Holding your breath"]},
  "split-squat": {name:"Split Squat or Reverse Lunge", note:"Either one. Split squat keeps both feet planted; reverse lunge steps back each rep.", cues:["Long staggered stance, dumbbells at your sides, torso tall.","Lower straight down until the back knee nearly touches the floor.","Front shin stays about vertical; weight in the front heel.","Drive through the front foot to rise."], mistakes:["Stance too short (front heel lifts)","Front knee caving in","Leaning far forward"]},
  "seated-oh-press": {name:"Seated Dumbbell Overhead Press", cues:["Sit on a bench (back pad upright if you have one), feet planted.","Dumbbells at shoulder height, wrists stacked over elbows.","Brace and press straight up until arms lock out overhead.","Lower under control back to shoulder height."], mistakes:["Arching the lower back off the pad","Pressing forward instead of straight up","Half reps"]},
  "chest-supported-row": {name:"Chest-Supported Incline Row", note:"Lie face down on a bench set to an incline (about 30–45°).", cues:["Chest on the pad, feet on the floor, arms hanging straight down.","Row both elbows back toward your hips.","Squeeze shoulder blades together for a beat at the top.","Lower slowly to a full stretch."], mistakes:["Lifting your chest off the pad to heave","Shrugging toward the ears","Cutting the stretch short"]},
  "sl-rdl": {name:"Single-Leg RDL or Hip Thrust", note:"Do either. Shown: single-leg RDL. Hip thrust: upper back on a bench, dumbbell on hips, drive hips up to a straight line, chin tucked.", cues:["Hold the dumbbell in the hand opposite your standing leg.","Soft knee on the standing leg; hinge at the hip.","Back leg rises as your chest lowers: one straight line from head to heel.","Keep hips square to the floor; squeeze the glute to stand."], mistakes:["Rounding the back","Hip rotating open toward the ceiling","Locking the standing knee"]},
  "db-curl": {name:"Dumbbell Curl", cues:["Stand tall, palms forward, elbows pinned at your sides.","Curl up until forearms are vertical.","Squeeze, then lower slowly (2–3 seconds).","Fully straighten at the bottom."], mistakes:["Swinging with the hips or back","Elbows drifting forward","Half reps"]},
  "oh-triceps": {name:"Overhead Triceps Extension", cues:["Hold one dumbbell overhead with both hands.","Keep elbows pointing up and close to your head.","Lower the weight behind your head by bending only the elbows.","Straighten arms fully to the top."], mistakes:["Elbows flaring wide","Arching the lower back (brace your abs)","Moving the upper arms"]},
  "farmer-carry": {name:"Farmer Carry", cues:["Pick up your heaviest dumbbells with a flat back.","Stand tall, shoulders back and down, arms straight.","Walk with short, controlled steps; brace your abs.","Set them down with a flat back."], mistakes:["Leaning to one side or shrugging","Letting the dumbbells swing","Rounding the back to pick up or set down"]},
  "push-up": {name:"Push-Up", note:"Hands up on a bench if needed to get good-form reps.", cues:["Hands slightly wider than shoulders; body in one straight line.","Lower your chest toward the floor, elbows about 45° from your body.","Push the floor away until arms are straight.","End each set about 2 reps before failure."], mistakes:["Hips sagging or piking up","Elbows flared straight out","Half reps or head dropping"]},
  "step-up": {name:"Step-Up", cues:["Use a sturdy box or bench, knee height or lower.","Put your whole foot on the box.","Drive through that heel to stand tall on top.","Step down slowly; finish one leg, then switch."], mistakes:["Pushing off the back foot","Front knee caving in","Dropping down fast"]},
  "rear-delt-fly": {name:"Rear-Delt Fly", cues:["Hinge forward until your torso is nearly parallel to the floor, back flat.","Light dumbbells hang under your shoulders, palms in, elbows slightly bent.","Raise arms out to the sides to shoulder height, leading with the back of the shoulders.","Lower slowly."], mistakes:["Going heavy and swinging","Shrugging the shoulders","Standing up as you lift"]},
  "dead-bug": {name:"Dead Bug", cues:["Lie on your back, arms straight up, hips and knees bent 90° (tabletop).","Press your lower back gently into the floor.","Slowly reach one arm overhead while straightening the opposite leg, hovering just off the floor.","Return and switch sides; breathe out as you reach."], mistakes:["Lower back arching off the floor","Rushing the reps","Moving the same-side arm and leg"]}
};
/* side: label for unilateral work; note: day-specific detail; ss:1/2 = superset first/second; hold: [min,max] seconds; repsText: free-text target */
const DAYS = {
  A: [{id:"goblet-squat",sets:4,reps:"10–15",note:"3-second lowering."},
      {id:"db-bench",sets:4,reps:"10–15"},
      {id:"one-arm-row",sets:4,reps:"10–12",side:"each side"},
      {id:"rdl",sets:3,reps:"12–15",note:"Hip hinge, soft knees, flat back."},
      {id:"lateral-raise",sets:3,reps:"15–20"},
      {id:"plank",sets:3,reps:"30–45 s",hold:[30,45]}],
  B: [{id:"split-squat",sets:3,reps:"8–12",side:"each leg"},
      {id:"seated-oh-press",sets:4,reps:"10–12"},
      {id:"chest-supported-row",sets:4,reps:"12–15"},
      {id:"sl-rdl",sets:3,reps:"10–12",side:"each leg for SL RDL"},
      {id:"db-curl",sets:3,reps:"12–15",ss:1,tag:"5a"},
      {id:"oh-triceps",sets:3,reps:"12–15",ss:2,tag:"5b"},
      {id:"farmer-carry",sets:3,reps:"40 steps",note:"Use your heaviest dumbbells."}],
  C: [{id:"goblet-squat-pause",sets:3,reps:"10–12",note:"2-second pause at the bottom."},
      {id:"push-up",sets:3,repsText:"stop about 2 reps short of failure"},
      {id:"one-arm-row",sets:3,reps:"12–15",side:"each side"},
      {id:"step-up",sets:3,reps:"10",side:"each leg"},
      {id:"rear-delt-fly",sets:3,reps:"15–20"},
      {id:"dead-bug",sets:3,reps:"10",side:"each side"}]
};
const RULES = [
  "Rest 60–90 seconds between sets (the timer starts at 75 s; adjust with −15 / +15).",
  "Finish each set with 1–2 good reps left in the tank.",
  "First two weeks: 2 sets of everything.",
  "Progression with a 35 lb max: add reps up to about 20, then make it harder with a 3–4 second lowering, pauses, or single-arm / single-leg versions."
];
const RAMP_DAYS = 14, RAMP_SETS = 2, DEFAULT_REST = 75;

/* ============ ANIMATION POSES ============ */
/* Side view, facing right. Angles in degrees: 0 = straight down, 90 = forward (right), 180 = up, -90 = back (left).
   t torso (hip->shoulder), ua/fa near upper/fore arm, th/sh near thigh/shin, fd foot; ...2 = far side.
   line: straight-body mode (plank/push-up), e = body angle above horizontal from the ankles.
   fixN / fix2: near / far ankle planted (2-bone IK). tm: [cycle ms, lower, hold, raise] fractions. walk: cycle all poses. */
const GOB=[{t:180,ua:15,fa:165,th:0,sh:0},{t:148,ua:45,fa:172,th:88,sh:-32}];
const ANIM = {
  "goblet-squat":{poses:GOB,goblet:1,tm:[5000,.6,.04,.24]},
  "goblet-squat-pause":{poses:GOB,goblet:1,tm:[5200,.3,.42,.2]},
  "db-bench":{poses:[{hip:[118,136],t:-90,ua:180,fa:180,th:96,sh:-6},{hip:[118,136],t:-90,ua:50,fa:180,th:96,sh:-6}],props:[["bench",40,142,138]]},
  "one-arm-row":{poses:[{t:102,ua:0,fa:0,ua2:12,fa2:0,th:12,sh:0,th2:-14,sh2:-8},{t:102,ua:-118,fa:-4,ua2:12,fa2:0,th:12,sh:0,th2:-14,sh2:-8}],props:[["block",150,140,30]],noFarDB:1},
  "rdl":{poses:[{t:180,ua:6,fa:6,th:0,sh:0},{t:96,ua:-2,fa:-2,th:16,sh:-6}]},
  "lateral-raise":{view:"front",poses:[{la:8,eb:4},{la:86,eb:10}]},
  "plank":{line:{ankle:[12,165]},poses:[{e:11.5,ua:0,fa:90,fd:30},{e:12.2,ua:-1,fa:90,fd:30}],noHandDB:1,tm:[3600,.45,.05,.45]},
  "split-squat":{poses:[{t:180,ua:6,fa:6,th:25,sh:25,fd2:56},{t:178,ua:6,fa:6,th:85,sh:-5,fd2:56}],ax:132,fix2:[68,164]},
  "seated-oh-press":{poses:[{t:180,ua:16,fa:176,th:90,sh:0},{t:180,ua:176,fa:180,th:90,sh:0}],ax:140,props:[["block",78,139,40],["block",86,84,7,55]]},
  "chest-supported-row":{poses:[{hip:[104,104],t:125,ua:0,fa:0,th:-30,sh:-30,fd:60},{hip:[104,104],t:125,ua:-125,fa:-4,th:-30,sh:-30,fd:60}],pad:1},
  "sl-rdl":{poses:[{t:180,ua:4,fa:4,th:0,sh:0,th2:6,sh2:-14,fd2:90},{t:94,ua:-2,fa:-2,th:12,sh:-4,th2:-86,sh2:-86,fd2:0}],noNearDB:1,ax:112,tm:[3400,.4,.12,.38]},
  "db-curl":{poses:[{t:180,ua:6,fa:8,th:0,sh:0},{t:180,ua:6,fa:158,th:0,sh:0}]},
  "oh-triceps":{poses:[{t:180,ua:172,fa:-22,th:0,sh:0},{t:180,ua:172,fa:178,th:0,sh:0}],goblet:1},
  "farmer-carry":{walk:1600,poses:[
     {hip:[110,96],t:180,ua:3,fa:3,th:22,sh:6,fd:90,th2:-18,sh2:-34,fd2:60},
     {hip:[110,95],t:180,ua:3,fa:3,th:0,sh:0,fd:90,th2:22,sh2:-30,fd2:90},
     {hip:[110,96],t:180,ua:3,fa:3,th:-18,sh:-34,fd:60,th2:22,sh2:6,fd2:90},

  "push-up":{line:{ankle:[30,165],hand:[146,171]},poses:[{e:21.6,fd:30},{e:8,fd:30}],noHandDB:1},

  let s=current(); if(s) return s;

  const day=nextDay(), date=today(), ramp=rampActive();

    a.forEach((x,j)=>{ t++; const done = it.ss===1 ? (x.d && s.sets[i+1][j] && s.sets[i+1][j].d) : x.d; if(done) d++; }); });

/* ============ AUDIO (unlocked on first tap) ============ */
let actx=null;
function unlockAudio(){
  try{
    if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); }
    if(actx && actx.state==="suspended") actx.resume();
    if(actx && !actx._primed){ const o=actx.createOscillator(),g=actx.createGain(); g.gain.value=0.0001; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+0.02); actx._primed=true; }
  }catch(e){}
}
function beep(){
  try{
    if(actx){ if(actx.state==="suspended") actx.resume();
      [0,0.22].forEach(off=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type="sine"; o.frequency.value=880;
        const t0=actx.currentTime+off; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.35,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);
        o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+0.2); });
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([180,80,180]); }catch(e){}

/* ============ FLOW LOGIC ============ */
function nextUnchecked(s,i){ return s.sets[i].findIndex(x=>!x.d); }
/* Where to go after set j of exercise i is checked. Returns {type:'set'|'ex'|'done', i, rest:boolean} */
function planAfterCheck(s,i){
  const items=DAYS[s.day], it=items[i];
  if(it.ss===1){ // first half of superset: straight to partner, no rest
    if(nextUnchecked(s,i+1)>=0) return {type:"ex",i:i+1,rest:false};
    if(nextUnchecked(s,i)>=0) return {type:"set",i,rest:true};
  }
  if(it.ss===2){ // second half: rest, then back to partner if it still has sets
    if(nextUnchecked(s,i-1)>=0) return {type:"ex",i:i-1,rest:true};
  }
  if(nextUnchecked(s,i)>=0) return {type:"set",i,rest:true};
  // exercise complete
  if(i+1<items.length) return {type:"ex",i:i+1,rest:true};
  return {type:"done",rest:false};
}
function applyTarget(s,tg){
  if(tg.type==="done"){ finish(s); return; }
  if(s.idx!==tg.i){ s.idx=tg.i; save(s); }
  if(location.hash!=="#/go") go("#/go"); else render();
  window.scrollTo(0,0);
}

function showRest(){

  clearInterval(restTick); restTick=setInterval(updateRest,200); updateRest();
}
function hideRest(){ $("rest").classList.remove("show"); clearInterval(restTick); restTick=null; }

    (s?'<button class="linkbtn small" id="restartBtn">Start this workout over</button>':'')+
    '<div class="links">'+FOOT+'</div></div>';
  $("startBtn").onclick=()=>{ unlockAudio(); startSession(); go("#/go"); };
  app.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ store.set("wfg-demo-pick",b.dataset.day); render(); });
  if(s) $("restartBtn").onclick=()=>{ if(confirm("Clear the checked sets and start this workout over?")){ cancelRest(false); store.del(s.key); store.del("wfg-demo-current"); render(); } };
}

function exBody(id,it,s,i){
  const ex=EX[id]; const items=s?DAYS[s.day]:null;
  let ssNote="";
  if(it&&it.ss){ const partner=EX[items[it.ss===1?i+1:i-1].id].name;
    ssNote='<div class="ss" id="ssNote"><b>Superset '+(it.ss===1?'5a':'5b')+'</b> with '+esc(partner)+': '+(it.ss===1?'do a set, then go straight to triceps (it opens automatically). No rest in between.':'do a set right after the curls, then rest 60–90 s. The next round of curls opens after the rest.')+'</div>'; }
  const rx = it ? '<div class="rx">'+(it.tag?'<span class="muted">'+it.tag+' · </span>':'')+esc(rxText(it,s?s.sets[i].length:it.sets))+(it.side?' <span class="muted">'+esc(it.side)+'</span>':'')+' <span class="muted">· rest 60–90 s</span></div>'+(it.note?'<div class="daynote" id="dayNote">'+esc(it.note)+'</div>':'') : '';
  let setsHtml="";
  if(s){
    const arr=s.sets[i], nu=nextUnchecked(s,i), dn=arr.filter(x=>x.d).length;
    setsHtml='<div class="sets-head"><b>Sets</b><span id="setCount" class="muted">'+dn+'/'+arr.length+' sets</span></div><div class="sets">'+
      arr.map((x,j)=>'<div class="set"><button class="box'+(x.d?' on':'')+(j===nu?' next':'')+'" data-set="'+j+'" aria-pressed="'+x.d+'" aria-label="Set '+(j+1)+'"><span class="ck">'+(x.d?'✓':'')+'</span>Set '+(j+1)+'</button>'+
        '<input type="number" inputmode="numeric" min="0" max="99" placeholder="reps" aria-label="Reps done set '+(j+1)+'" data-reps="'+j+'" value="'+esc(x.r)+'"></div>').join("")+'</div>';
  }
  if(s&&it&&it.hold) setsHtml+='<div class="hold"><button class="btn ghost" id="holdBtn">Start hold</button><span class="hold-t" id="holdTime">0:00</span><span class="muted small">target '+it.hold[0]+'–'+it.hold[1]+' s</span></div>';
  return '<h1>'+esc(ex.name)+'</h1>'+rx+ssNote+(ex.note?'<p class="muted small" style="margin:6px 0 0">'+esc(ex.note)+'</p>':'')+
    '<div class="cols"><div><div class="anim" id="anim"></div>'+setsHtml+'</div>'+
    '<div><div class="card"><h2>Form cues</h2><ul class="cues">'+ex.cues.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul></div>'+
    '<div class="card"><h2>Common mistakes</h2><ul class="mist">'+ex.mistakes.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul></div></div></div>';
}

function viewWorkout(){
  const s=current(); if(!s){ go("#/"); return; }
  const items=DAYS[s.day]; const i=Math.min(s.idx,items.length-1); const it=items[i]; const c=counts(s);
  app.innerHTML='<div class="top"><div class="top-in"><button class="x" id="homeBtn" aria-label="Home">✕</button><div class="meta">'+
    '<div class="row"><span id="exPos">Day '+s.day+' · Exercise '+(i+1)+' of '+items.length+'</span><span id="dayProg">'+c.d+' of '+c.t+' sets</span></div>'+
    '<div class="bar"><i id="dayBar" style="width:'+(c.t?c.d/c.t*100:0)+'%"></i></div></div></div></div>'+
    '<div class="ex">'+exBody(it.id,it,s,i)+FOOT+'</div>'+
    '<div class="bottom"><div class="bottom-in"><button class="btn ghost" id="backBtn"'+(i===0?' disabled':'')+'>Back</button>'+
    '<button class="btn primary" id="nextBtn">'+(i===items.length-1?'Finish':'Next')+'</button></div></div>';
  mountFigure($("anim"),it.id);
  $("homeBtn").onclick=()=>go("#/");
  $("backBtn").onclick=()=>{ cancelRest(false); s.idx=Math.max(0,i-1); save(s); render(); window.scrollTo(0,0); };
  $("nextBtn").onclick=()=>{ cancelRest(false); if(i===items.length-1){ finish(s); return; } s.idx=i+1; save(s); render(); window.scrollTo(0,0); };
  app.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{
    unlockAudio();
    const j=+b.dataset.set, ss=current(); if(!ss) return; const x=ss.sets[i][j];
    x.d=!x.d; save(ss);
    if(!x.d){ cancelRest(true); return; }        // unchecking cancels its timer
    if(ss.rest){ delete ss.rest; save(ss); }      // a new check replaces any running timer
    const tg=planAfterCheck(ss,i);
    if(!tg.rest){ applyTarget(ss,tg); return; }
    render();
    let label;
    if(tg.type==="set") label="Next: "+EX[items[tg.i].id].name+" — set "+(nextUnchecked(ss,tg.i)+1);
    else label="Next: "+EX[items[tg.i].id].name+(items[tg.i].ss&&tg.i<i?" — next round":"");
    startRest(ss,tg,label);
  });
  app.querySelectorAll("[data-reps]").forEach(inp=>inp.oninput=()=>{ const ss=current(); if(!ss) return; ss.sets[i][+inp.dataset.reps].r=inp.value.slice(0,3); save(ss); });
  if(it.hold) wireHold(it.hold);
  if(s.rest) showRest();
}
/* Plank hold timer (count-up, timestamp based; beeps at the low and high end of the target) */
let holdTick=null, holdStart=0, holdFlags=0;
function stopHold(){ clearInterval(holdTick); holdTick=null; }
function wireHold(rng){
  const btn=$("holdBtn"), out=$("holdTime"); if(!btn) return;
  btn.onclick=()=>{ unlockAudio();
    if(holdTick){ stopHold(); btn.textContent="Start hold"; return; }
    holdStart=Date.now(); holdFlags=0; btn.textContent="Stop";
    const upd=()=>{ if(!$("holdTime")){ stopHold(); return; } const sec=(Date.now()-holdStart)/1000; $("holdTime").textContent=fmt(Math.floor(sec));
      if(sec>=rng[0]&&!(holdFlags&1)){ holdFlags|=1; beep(); } if(sec>=rng[1]&&!(holdFlags&2)){ holdFlags|=2; beep(); } };
    holdTick=setInterval(upd,200); upd(); };
}

function viewDone(){
  const last=store.get("wfg-demo-last");
  if(!last){ go("#/"); return; }
  app.innerHTML='<div class="wrap done"><div class="big">✅</div><h1 id="doneTitle">Day '+last.day+' done — '+last.done+' of '+last.total+' sets</h1>'+
    '<p class="muted">Next time: Day '+nextDay()+'</p><div style="height:20px"></div>'+
    '<button class="btn primary" id="homeBtn" style="width:100%;max-width:360px">Back to home</button>'+
    '<p style="margin-top:28px"><a href="#/about">About the plan</a></p>'+FOOT+'</div>';
  $("homeBtn").onclick=()=>go("#/");
}

function viewAbout(){
  const ramp=rampActive();
  app.innerHTML='<div class="wrap about"><p><a href="#/" id="backHome">← Home</a></p><h1>About the plan</h1>'+
    '<p class="muted">3-day full-body dumbbell plan. Rotate Day A → B → C. Tap any exercise to see its form guide.'+(ramp?' <b>You are in weeks 1–2: 2 sets of everything.</b>':'')+'</p>'+
    '<div class="about-grid">'+Object.keys(DAYS).map(d=>'<div class="card day"><h2><span>Day '+d+'</span><span class="muted small">'+planSets(d,false)+' sets'+(DAYS[d].some(x=>x.ss)?'*':'')+'</span></h2><ul class="plan-list">'+
      DAYS[d].map((it,j)=>'<li><div><a href="#/ex/'+d+'/'+j+'">'+(it.tag?it.tag+'. ':(j+1-(DAYS[d].slice(0,j).some(x=>x.ss===2)?1:0))+'. ')+esc(EX[it.id].name)+'</a>'+(it.note||it.side||it.ss?'<div class="muted small">'+esc([it.ss===1?'superset with 5b, no rest between':it.ss===2?'rest after this one':'',it.side,it.note].filter(Boolean).join(' · '))+'</div>':'')+'</div><span class="muted">'+esc(it.repsText?it.sets+' sets':it.sets+' × '+it.reps)+'</span></li>').join("")+
      (DAYS[d].some(x=>x.ss)?'<li class="muted small" style="display:block">*Each 5a + 5b round counts as one set.</li>':'')+'</ul></div>').join("")+'</div>'+
    '<div class="card"><h2>Rules</h2><ul>'+RULES.map(r=>'<li>'+esc(r)+'</li>').join("")+'</ul></div>'+FOOT+'</div>';
}

function viewExercise(ref){
  let id=ref, it=null; const m=ref.match(/^([ABC])\/(\d+)$/);
  if(m&&DAYS[m[1]][+m[2]]){ it=DAYS[m[1]][+m[2]]; id=it.id; }
  else { for(const d in DAYS){ const f=DAYS[d].find(x=>x.id===id); if(f){ it=f; break; } } }
  if(!EX[id]){ go("#/about"); return; }
  app.innerHTML='<div class="ex"><p><a href="#/about">← About the plan</a></p>'+exBody(id,it?{...it,ss:0}:null,null,0)+FOOT+'</div>';
  mountFigure($("anim"),id);
}

function render(){
  const h=location.hash||"#/";
  if(h!=="#/go") hideRest();
  stopHold();
  if(h==="#/go") viewWorkout();
  else if(h==="#/done") viewDone();
  else if(h==="#/about") viewAbout();
  else if(h.startsWith("#/ex/")) viewExercise(decodeURIComponent(h.slice(5)));
  else { animState=null; viewHome(); }
  if(!h.startsWith("#/go")&&!h.startsWith("#/ex")) animState=animState&&animState.svg.isConnected?animState:null;
}
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });
$("resetDemo").onclick=()=>{ hideRest(); stopHold();
  try{ const ks=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(okKey(k)) ks.push(k); } ks.forEach(k=>localStorage.removeItem(k)); }catch(e){}
  if(location.hash&&location.hash!=="#/") location.hash="#/"; else render(); window.scrollTo(0,0); };
render();
</script>
</body>
